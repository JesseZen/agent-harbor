name: Release native packages
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15, target: darwin-arm64}
          - {os: macos-15-intel, target: darwin-amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache-dependency-path: bridge/go.sum
      - name: Test Go module in isolated homes
        shell: bash
        run: |
          GOCACHE=$(go env GOCACHE)
          GOMODCACHE=$(go env GOMODCACHE)
          export GOCACHE GOMODCACHE
          export HOME="$RUNNER_TEMP/harbor-test-home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state" XDG_CACHE_HOME="$HOME/cache" XDG_RUNTIME_DIR="$HOME/runtime" CODEX_HOME="$HOME/codex" CODEX_SQLITE_HOME="$HOME/sqlite" TMPDIR="$HOME/tmp"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR" "$CODEX_HOME" "$CODEX_SQLITE_HOME" "$TMPDIR"
          (cd bridge && GOWORK=off go test ./... && GOWORK=off go vet ./...)
      - name: Download pinned dependencies and package Harbor
        env:
          AGENT_HARBOR_BRIDGE_VERSION: ${{ github.ref_name }}
        run: sh distribution/download-dependencies.sh '${{ matrix.target }}'
      - name: Test in isolated homes
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/harbor-test-home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state" XDG_CACHE_HOME="$HOME/cache" XDG_RUNTIME_DIR="$HOME/runtime" CODEX_HOME="$HOME/codex" CODEX_SQLITE_HOME="$HOME/sqlite" TMPDIR="$HOME/tmp"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR" "$CODEX_HOME" "$CODEX_SQLITE_HOME" "$TMPDIR"
          python3 bridge/tests/package_install.py dist/*.tar.gz
          python3 bridge/tests/distribution_install.py dist/${{ matrix.target }}/agent-harbor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Prepare checksums and Homebrew formula
        run: |
          cp distribution/install.sh dist/install.sh
          (cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS)
          python3 distribution/homebrew.py "$GITHUB_REF_NAME" dist/SHA256SUMS > dist/agent-harbor.rb
      - name: Publish development candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --prerelease --title "Agent Harbor $GITHUB_REF_NAME" --notes-file distribution/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Advance install channel and Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B distribution-channel origin/main
          mkdir -p Formula
          cp dist/agent-harbor.rb Formula/agent-harbor.rb
          printf '%s\n' "$GITHUB_REF_NAME" > distribution/latest
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/agent-harbor.rb distribution/latest
          git diff --cached --quiet || git commit -m "Publish $GITHUB_REF_NAME install channel and Homebrew formula"
          git push origin HEAD:main
  verify-public-install:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - name: Install and update from public release
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/published-home"
          mkdir -p "$HOME"
          export PATH="$HOME/.local/bin:$PATH"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" -o "$RUNNER_TEMP/install-harbor.sh"
          sh "$RUNNER_TEMP/install-harbor.sh" --version "$GITHUB_REF_NAME"
          ah version
          agent-harbor version
          ah update --version "$GITHUB_REF_NAME"
          ah uninstall
          test ! -e "$HOME/.local/bin/ah"
      - name: Verify Homebrew installation
        if: runner.os == 'macOS'
        run: |
          brew tap jessezen/agent-harbor "https://github.com/$GITHUB_REPOSITORY"
          brew install jessezen/agent-harbor/agent-harbor
          brew test agent-harbor
          ah version
          brew uninstall agent-harbor
