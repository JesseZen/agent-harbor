name: Build Harbor dependency
on:
  workflow_dispatch:
    inputs:
      intel_only:
        description: Diagnose Herdr on Intel macOS without publishing
        type: boolean
        default: false
  push:
    branches: ['harbor-candidate']
    tags: ['harbor-v*']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'JesseZen/herdr' || (github.repository == 'JesseZen/magpie' && !inputs.intel_only)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.intel_only || (github.repository == 'JesseZen/herdr' && github.ref == 'refs/heads/harbor-candidate')) && '[{"os":"macos-15-intel","target":"darwin-amd64"}]' || '[{"os":"macos-15-intel","target":"darwin-amd64"},{"os":"macos-15","target":"darwin-arm64"},{"os":"ubuntu-24.04","target":"linux-amd64"},{"os":"ubuntu-24.04-arm","target":"linux-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: github.event.repository.name == 'herdr'
        with:
          toolchain: '1.96.1'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        if: github.event.repository.name == 'herdr'
        with:
          version: '0.16.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: github.event.repository.name == 'magpie'
        with:
          go-version: '1.26.8'
      - name: Build and smoke-test candidate
        timeout-minutes: 35
        shell: bash
        env:
          DEPENDENCY: ${{ github.event.repository.name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/probes" "$RUNNER_TEMP/smoke-home"
          asset="$RUNNER_TEMP/assets/$DEPENDENCY-$TARGET"
          if [[ "$DEPENDENCY" == herdr ]]; then
            zig version
            if [[ "$TARGET" == darwin-amd64 ]]; then
              (
                while sleep 120; do
                  date -u
                  ps -axo pid,ppid,%cpu,etime,comm | awk '$NF ~ /(^|\/)(zig|cargo|rustc|build-script-build)$/'
                  for pid in $(pgrep -x zig || true); do
                    sample "$pid" 3 10 -file "$RUNNER_TEMP/probes/zig-$pid-$(date +%s).txt" || true
                  done
                done
              ) &
              monitor=$!
              trap 'kill "$monitor" 2>/dev/null || true' EXIT
            fi
            cargo build --release --locked -vv
            cp target/release/herdr "$asset"
          else
            CGO_ENABLED=0 go build -tags nogui -trimpath -ldflags '-s -w -X main.version=0.1.3528-harbor-dev' -o "$asset" .
          fi
          HOME="$RUNNER_TEMP/smoke-home" XDG_CONFIG_HOME="$RUNNER_TEMP/smoke-home/config" "$asset" --version
          file "$asset"
          git rev-parse HEAD > "$asset.commit"
          (cd "$RUNNER_TEMP/assets" && shasum -a 256 "$DEPENDENCY-$TARGET" > "$DEPENDENCY-$TARGET.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.target == 'darwin-amd64' && github.event.repository.name == 'herdr'
        with:
          name: intel-zig-samples
          path: ${{ runner.temp }}/probes/*.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/harbor-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Publish candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes "Harbor dependency candidate built from $GITHUB_SHA. Not an upstream release."
