openapi: 3.0.3
info:
  title: Agent Harbor Admin API
  version: 0.1.0
  description: |
    Local administrator contract for configuration, readiness, sessions,
    runtime status, provider-secret operations, target control, and shutdown.
    Unix-socket peer authorization occurs before HTTP dispatch. An explicitly
    enabled loopback TCP listener requires the AdminToken security scheme.
  license:
    name: MIT
    url: https://opensource.org/license/mit
x-requirement-definitions:
  V3-API-001: Admin and Gateway listeners, routers, authentication, and generated
    packages are separate.
  V3-API-002: Unix peer authorization or loopback AdminToken establishes one local
    administrator principal before handler dispatch.
  V3-API-003: Admin failures use the closed RFC 9457 Problem schema and have no
    side effects before validation and authorization pass.
  V3-API-004: Runtime events use monotonic decimal IDs; stale cursors receive
    resync_required and reconnect from a full status snapshot.
  V3-API-005: Runtime status and bounded observation pages expose every masked
    field required by the TUI without client-side contract mirrors.
  V3-API-006: Partial credential replacement constructs, compiles, and publishes
    one complete candidate graph under expected-generation control.
servers:
  - url: http://localhost
    description: Unix socket or explicitly enabled loopback Admin listener
tags:
  - name: instance
    description: Exact instance readiness, status, observations, and shutdown
  - name: config
    description: Complete graph validation and atomic publication
  - name: sessions
    description: AgentSession lifecycle, credentials, and affinity
  - name: targets
    description: Target probe and suspend operations
  - name: secrets
    description: No-store local provider-secret operations
paths:
  "/v1/readiness":
    get:
      operationId: getReadiness
      tags:
        - instance
      x-requirements:
        - V3-SCP-002
        - V3-SCP-003
        - V3-CAP-003
      summary: Get exact instance readiness
      x-error-codes:
        - operation_error
      responses:
        '200':
          description: Exact ready instance identity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/status":
    get:
      operationId: getRuntimeStatus
      tags:
        - instance
      x-requirements:
        - V3-CAP-011
        - V3-OBS-001
        - V3-API-005
      summary: Get masked runtime status
      x-error-codes:
        - operation_error
      responses:
        '200':
          description: Masked complete runtime status snapshot
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RuntimeStatus"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/events":
    get:
      operationId: streamRuntimeEvents
      tags:
        - instance
      x-requirements:
        - V3-CAP-011
        - V3-CAP-021
        - V3-API-005
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
      summary: Stream runtime observation events
      x-observation-cursor:
        id_format: unsigned_decimal
        stream:
          last_event_id_is_exclusive: true
          emitted_ids_are_strictly_monotonic: true
          stale_cursor_event: resync_required
          stale_cursor_closes_stream: true
          client_cursor_never_regresses: true
        cross_endpoint_snapshot:
          runtime_status_field: RuntimeStatus.observations.last_event_id
          page_field: ObservationPage.next_cursor
          frozen_until: required_listObservations_until_query
          resume_cursor: terminal_committed_observation_page_cursor_equal_to_until
          reason: concurrent_events_above_until_are_replayed_by_the_exclusive_stream
      x-error-codes:
        - validation_error
        - operation_error
      responses:
        '200':
          description: |
            Server-sent events. Each event has decimal `id`, an event name equal
            to RuntimeEvent.type, and one JSON RuntimeEvent object in `data`.
            A stale cursor returns event `resync_required` then closes.
          content:
            text/event-stream:
              schema:
                "$ref": "#/components/schemas/RuntimeEvent"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/observations":
    get:
      operationId: listObservations
      tags:
        - instance
      x-requirements:
        - V3-CAP-011
        - V3-CAP-021
      summary: List bounded redacted observations
      description: Returns a bounded redacted observation window no newer than the
        required frozen `until` high-water. `after` is an exclusive
        unsigned-decimal lower bound and omitted `after` is the reset sentinel
        zero. Reset reads return the newest retained records at or below `until`
        in ascending order and finish with `next_cursor=until`. Forward reads
        return records in `(after, until]`; nonterminal pages advance to the
        last item and a terminal or empty page returns `next_cursor=until`. A
        nonzero cursor below the retention floor returns
        `observation_cursor_stale`.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: until
          in: query
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      x-observation-cursor:
        id_format: unsigned_decimal
        after_is_exclusive: true
        omitted_after: "0"
        zero_after: reset_sentinel_always_valid
        until_is_inclusive_frozen_high_water: true
        until_source: RuntimeStatus.observations.last_event_id
        item_order: event_id_ascending
        reset_page: newest_retained_records_at_or_below_until_bounded_by_limit_then_ascending
        forward_page: records_strictly_after_after_and_at_or_below_until_bounded_by_limit
        nonterminal_next_cursor: last_returned_item_id
        terminal_or_empty_next_cursor: until
        stale_nonzero_after_below_retention_floor: observation_cursor_stale
        until_less_than_after: invalid_value
        next_cursor_is_page_offset: false
        page_read_consistency: one_locked_history_snapshot
        client_cursor_never_regresses: true
        concurrent_records_above_until: excluded_from_page_and_replayed_by_sse_after_terminal_commit
      x-error-codes:
        - observation_cursor_stale
        - validation_error
        - operation_error
      responses:
        '200':
          description: Bounded redacted observations ordered by event ID
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ObservationPage"
        "409":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/config":
    get:
      operationId: getConfig
      responses:
        "200":
          description: Complete mutable configuration view with masked credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutableConfigSnapshot"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchConfig
      x-audit: config_publish
      x-cancellation: Cancellation before the publication transaction commits leaves
        the active snapshot unchanged; after commit the result is
        operation_unknown and the caller reloads readiness and config without
        replaying publication.
      x-error-codes:
        - instance_mismatch
        - generation_conflict
        - no_change
        - duplicate_id
        - validation_error
        - stage_not_found
        - stage_expired
        - stage_reserved
        - secret_prepare_failed
        - secret_cleanup_pending
        - publish_conflict
        - operation_error
        - operation_unknown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConfigCommand"
      responses:
        "200":
          description: Newly active immutable snapshot identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotIdentity"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/v1/config/validate":
    post:
      operationId: validateConfig
      x-side-effects: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateConfigCommand"
      responses:
        "200":
          description: Candidate compiled without persistence or external mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/v1/provider-secret-stages":
    post:
      operationId: createProviderSecretStage
      x-audit: provider_secret_stage_create
      x-cancellation: Cancellation before the stage is stored creates no stage;
        after storage the stage remains memory-only and expires after five minutes
        unless consumed or explicitly deleted.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 1
              maxLength: 65536
      responses:
        "201":
          description: Opaque single-use stage metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSecretStage"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/v1/provider-secret-stages/{stage_id}":
    delete:
      operationId: deleteProviderSecretStage
      x-audit: provider_secret_stage_delete
      x-cancellation: Cancellation before deletion commits leaves the stage
        unchanged; after deletion commits it is destroyed and an idempotent retry
        returns 204.
      parameters:
        - in: path
          name: stage_id
          required: true
          schema:
            $ref: "#/components/schemas/SecretStageID"
      responses:
        "204":
          description: Stage destroyed; deleting a missing or already destroyed stage is idempotent
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/v1/config/publish":
    post:
      operationId: publishConfig
      tags:
        - config
      x-requirements:
        - V3-CAP-002
        - V3-FLW-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishConfigCommand"
      summary: Publish a complete configuration graph
      x-audit: config_publish
      x-cancellation: Cancellation before the publication transaction commits leaves
        the active snapshot unchanged; after commit the result is
        operation_unknown and the caller reloads readiness and config without
        replaying publication.
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - validation_error
        - publish_conflict
        - native_config_root_denied
        - native_config_root_conflict
        - native_hook_entry_conflict
        - native_config_write_failed
        - operation_error
        - operation_unknown
      responses:
        '200':
          description: Newly active immutable snapshot identity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SnapshotIdentity"
        "409":
          $ref: "#/components/responses/Phase04Problem"
        "422":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions":
    get:
      operationId: listAgentSessions
      tags:
        - sessions
      x-requirements:
        - V3-CAP-011
        - V3-SES-001
      summary: List managed agent sessions
      parameters:
        - name: instance_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/InstanceID"
      x-error-codes:
        - instance_mismatch
        - validation_error
        - operation_error
      responses:
        '200':
          description: AgentSessions ordered by updated_at descending then ID
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/AgentSession"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
    post:
      operationId: createAgentSession
      tags:
        - sessions
      x-requirements:
        - V3-CAP-013
        - V3-SES-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentSessionCommand"
      summary: Create a managed agent session
      x-audit: session_create
      x-cancellation: Cancellation before the create transaction commits has no side
        effect; after commit the caller reloads the exact instance session list.
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - validation_error
        - operation_error
        - operation_unknown
      responses:
        '201':
          description: Persisted AgentSession before terminal launch
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgentSession"
        "422":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions/{session_id}":
    parameters:
      - "$ref": "#/components/parameters/SessionID"
    get:
      operationId: getAgentSession
      tags:
        - sessions
      x-requirements:
        - V3-CAP-011
        - V3-SES-001
      summary: Get one managed agent session
      parameters:
        - name: instance_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/InstanceID"
        - name: expected_updated_at
          in: query
          required: true
          schema:
            $ref: ./admin/deck.schemas.yaml#/components/schemas/ExpectedUpdatedAt
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - session_not_found
        - validation_error
        - operation_error
      responses:
        '200':
          description: One AgentSession
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgentSession"
        "404":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
    delete:
      operationId: deleteAgentSession
      tags:
        - sessions
      x-requirements:
        - V3-SES-004
        - V3-SES-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndAgentSessionCommand"
      summary: End and delete one managed agent session
      x-cancellation: Cancellation before the end transaction commits has no side
        effect; after pane ownership is resolved, deadline expiry returns
        operation_unknown and the client reloads the exact session.
      x-audit: session_delete
      x-session-end:
        precondition: cleanup_pending_false
        no_tmux: created_idle_or_failed_tombstone_and_AgentSession_delete_in_one_transaction
        live_tmux: ending_owner_uses_delete_session_cleanup_journal_until_tmux_delete_then_tombstone_and_AgentSession_delete_commit
        response: success_only_after_tombstone_and_AgentSession_delete_commit
        crash_recovery: delete_session_journal_never_clears_to_an_ended_AgentSession
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - session_not_found
        - invalid_lifecycle
        - tmux_identity_mismatch
        - operation_timeout
        - validation_error
        - operation_error
        - operation_unknown
      responses:
        '204':
          description: Session ended and deleted, credentials and affinity removed, owned
            tmux window removed, and minimal tombstone retained for 30 days
        "404":
          $ref: "#/components/responses/Phase04Problem"
        "409":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions/{session_id}/launch":
    post:
      operationId: launchAgentSession
      tags:
        - sessions
      x-requirements:
        - V3-CAP-013
        - V3-TMX-002
      parameters:
        - "$ref": "#/components/parameters/SessionID"
      summary: Launch an agent session in private tmux
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionLifecycleCommand"
      x-cancellation: Cancellation before the launch transaction commits has no side
        effect; after commit the per-session owner ignores request cancellation
        and converges to running or failed; an expired response returns
        operation_unknown and the client reloads the exact AgentSession.
      x-audit: session_launch
      x-session-lifecycle-command:
        state_rules_ref: session.schemas.yaml_AgentSession_x-agent-harbor-state-rules_command_lifecycle
        accepted: cleanup_pending_false_and_created_or_failed_without_native_pair_and_without_tmux_pair
        launcher_support: codex_or_claude_only_other_registered_launchers_return_validation_error
        workspace_preflight: before_transaction_or_validation_error_without_state_change
        terminal_obligation: running_or_failed_before_owner_release
      x-session-credential:
        pane_precondition: no_live_verified_AgentSession_pane
        before_spawn: revoke_prior_hash_create_next_active_hash_and_mark_launching_in_one_session_transaction
        process_delivery: private_session-exec_handoff_then_zero_the_raw_buffer_at_owner_terminal_state
        spawn_failure: revoke_the_new_hash_mark_session_failed_with_last_error_code_native_launch_failed_and_return_200
        process_exit_or_end: revoke_active_hash
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - session_not_found
        - invalid_lifecycle
        - tmux_identity_mismatch
        - operation_timeout
        - validation_error
        - operation_error
        - operation_unknown
      responses:
        "200":
          description: Updated running AgentSession, or explicit failed AgentSession with
            stable last_error_code after an accepted launch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "404":
          $ref: "#/components/responses/Phase04Problem"
        "409":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions/{session_id}/resume":
    post:
      operationId: resumeAgentSession
      tags:
        - sessions
      x-requirements:
        - V3-CAP-014
        - V3-TMX-002
      parameters:
        - "$ref": "#/components/parameters/SessionID"
      summary: Resume an agent session in private tmux
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionLifecycleCommand"
      x-cancellation: Cancellation before the resume transaction commits has no side
        effect; after commit the per-session owner ignores request cancellation
        and converges to running or failed; an expired response returns
        operation_unknown and the client reloads the exact session.
      x-audit: session_resume
      x-session-lifecycle-command:
        state_rules_ref: session.schemas.yaml_AgentSession_x-agent-harbor-state-rules_command_lifecycle
        accepted: cleanup_pending_false_and_idle_or_failed_with_native_pair_and_without_tmux_pair
        launcher_support: codex_or_claude_only_other_registered_launchers_return_validation_error
        workspace_preflight: before_transaction_or_validation_error_without_state_change
        terminal_obligation: running_or_failed_before_owner_release
      x-session-credential:
        pane_precondition: no_live_verified_AgentSession_pane
        before_spawn: revoke_prior_hash_create_next_active_hash_and_mark_launching_in_one_session_transaction
        process_delivery: private_session-exec_handoff_then_zero_the_raw_buffer_at_owner_terminal_state
        spawn_failure: revoke_the_new_hash_mark_session_failed_with_last_error_code_native_launch_failed_and_return_200
        process_exit_or_end: revoke_active_hash
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - session_not_found
        - invalid_lifecycle
        - resume_unavailable
        - tmux_identity_mismatch
        - operation_timeout
        - validation_error
        - operation_error
        - operation_unknown
      responses:
        "200":
          description: Updated running AgentSession, or explicit failed AgentSession with
            stable last_error_code after an accepted resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "404":
          $ref: "#/components/responses/Phase04Problem"
        "409":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions/{session_id}/credentials":
    post:
      operationId: rotateSessionCredential
      tags:
        - sessions
      x-requirements:
        - V3-CAP-004
        - V3-SEC-002
      parameters:
        - "$ref": "#/components/parameters/SessionID"
      summary: Rotate the session Gateway credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCredentialCommand"
      x-audit: session_credential_rotate
      x-cancellation: Cancellation before the credential transaction commits has no
        side effect; after commit the caller reloads the exact session and does
        not replay an unknown credential value.
      x-credential-lifecycle:
        pane_precondition: cleanup_pending_false_and_complete_pane_process_predicate_must_find_no_live_process
        transitions:
          none_0: active_1
          active_N: active_N_plus_1_with_prior_hash_revoked_in_same_transaction
          revoked_N: active_N_plus_1
        response: one_time_value_and_new_generation_no_store
        session_updated_at: changes_in_same_transaction
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - session_not_found
        - session_process_active
        - validation_error
        - operation_error
      responses:
        '201':
          description: New one-time credential; prior credential is revoked atomically
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OneTimeSessionCredential"
        "404":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions/{session_id}/credentials/revoke":
    post:
      operationId: revokeSessionCredential
      tags:
        - sessions
      x-requirements:
        - V3-CAP-004
        - V3-SEC-002
      parameters:
        - "$ref": "#/components/parameters/SessionID"
      summary: Revoke the session Gateway credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCredentialCommand"
      x-audit: session_credential_revoke
      x-cancellation: Cancellation before the revoke transaction commits has no side
        effect; after commit the caller reloads the exact session.
      x-credential-lifecycle:
        pane_precondition: cleanup_pending_false_and_complete_pane_process_predicate_must_find_no_live_process
        accepted_state: active_exact_generation
        result: revoked_same_generation_and_session_updated_at_in_one_transaction
        none_or_revoked: credential_not_found
      x-error-codes:
        - instance_mismatch
        - stale_precondition
        - session_not_found
        - session_process_active
        - credential_not_found
        - validation_error
        - operation_error
      responses:
        '204':
          description: Active SessionCredential revoked
        "404":
          $ref: "#/components/responses/Phase04Problem"
        default:
          $ref: "#/components/responses/Phase04Problem"
        "500":
          $ref: "#/components/responses/Phase04Problem"
  "/v1/sessions/{session_id}/affinity/reset":
    post:
      operationId: resetSessionAffinity
      tags:
        - sessions
      x-requirements:
        - V3-ROU-005
      parameters:
        - "$ref": "#/components/parameters/SessionID"
      summary: Reset sticky Target affinity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionVersionCommand"
