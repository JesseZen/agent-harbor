x-agent-harbor-operation-policy:
  classification: exhaustive_disjoint_union_of_every_merged_operationId
  read_only:
    operation_ids:
      - getReadiness
      - getConfig
      - getRuntimeStatus
      - validateConfig
      - listAgentSessions
      - getAgentSession
      - listObservations
      - streamRuntimeEvents
      - getAgentSessionPreview
      - getNativeHookHealth
      - discoverTargetModels
    cancellation: inherit_request_context_and_deadline_until_response_completion
    audit: none
  state_changing:
    operation_ids:
      - patchConfig
      - createProviderSecretStage
      - deleteProviderSecretStage
      - publishConfig
      - createAgentSession
      - launchAgentSession
      - resumeAgentSession
      - deleteAgentSession
      - rotateSessionCredential
      - revokeSessionCredential
      - resetSessionAffinity
      - replaceProviderCredential
      - probeTarget
      - setTargetSuspended
      - rotateAdminToken
      - shutdownInstance
      - authorizeAgentSessionAttach
      - redeemAgentSessionAttachment
    cancellation: operation_x-cancellation_required
    audit: operation_x-audit_required
  secret_access:
    operation_ids:
      - accessProviderSecret
    cancellation: operation_x-cancellation_required
    audit: operation_x-audit_required_before_value_resolution
x-agent-harbor-attachment-transport:
  operation_ids:
    - authorizeAgentSessionAttach
    - redeemAgentSessionAttachment
  allowed: same_uid_unix_peer_on_exact_instance_socket
  loopback_tcp_or_browser: unix_peer_required
  fallback: none
x-deck-bootstrap:
  selectors: explicit_instance_id_and_exactly_one_of_admin_socket_or_admin_address
  discovery: none
  tcp_token_open: open_O_RDONLY_O_NOFOLLOW_once_before_any_network_request
  tcp_token_file: same_fd_fstat_effective_uid_owned_regular_mode_exactly_0600
  tcp_token_bytes: exactly_43_ASCII_base64url_bytes_then_EOF_without_trimming
  tcp_token_failure: close_fd_clear_private_auth_and_exit_before_network_without_token_bytes
  tcp_token_use: AdminToken_on_every_TCP_request_including_readiness_and_reconnect
  tcp_token_residency: private_transport_auth_memory_only
  tcp_token_excluded_from:
    - argv
    - environment
    - reducer
    - view_cache
    - persistence
    - logs
    - errors
  tcp_token_clear: terminal_instance_mismatch_or_process_exit
  reconnect: reuse_private_transport_auth_then_repeat_exact_readiness_validation
  binding: expected_instance_id_exact_transport_and_private_TCP_auth_when_selected
  mismatch: close_transport_discard_cache_clear_private_auth_and_exit_instance_mismatch
