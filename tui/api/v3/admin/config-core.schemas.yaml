components:
  schemas:
    ConfigGraph:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - instance
        - client_profiles
        - content_policies
        - routes
        - backend_sets
        - endpoints
        - credentials
        - quota_groups
        - targets
        - model_policies
        - model_projections
        - compatibility_transforms
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        instance:
          "$ref": "#/components/schemas/InstanceConfig"
        client_profiles:
          type: array
          items:
            "$ref": "#/components/schemas/ClientProfileConfig"
        content_policies:
          type: array
          items:
            "$ref": "#/components/schemas/ContentPolicyConfig"
        routes:
          type: array
          items:
            "$ref": "#/components/schemas/RouteConfig"
        backend_sets:
          type: array
          items:
            "$ref": "#/components/schemas/BackendSetConfig"
        endpoints:
          type: array
          items:
            "$ref": "#/components/schemas/EndpointConfig"
        credentials:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/ProviderCredentialC\
              onfig"
        quota_groups:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/QuotaGroupConfig"
        targets:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/TargetConfig"
        model_policies:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/ModelPolicyConfig"
        model_projections:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/ModelProjectionConf\
              ig"
        compatibility_transforms:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/CompatibilityTransf\
              ormConfig"
        managed_objects:
          type: array
          uniqueItems: true
          description: Optional ownership metadata for user-facing resource bundles. Core persists and validates it but does not use it for request routing.
          items:
            $ref: "#/components/schemas/ManagedObject"
      x-agent-harbor-session-reference-publication:
        all_sessions: referenced_client_profile_and_route_must_exist
        native_identity: referenced_profile_launcher_must_equal_native_provider_and_effective_config_root_identity_must_not_change
        live_pane: referenced_ResolvedLauncherPlan_fingerprint_must_not_change
        idle_or_failed_without_live_pane: same_provider_same_config_root_other_plan_change_allowed
        rejection: publish_conflict
    ConfigOverview:
      type: object
      additionalProperties: false
      required:
        - active_generation
        - config_revision
        - compiled_summary
        - graph
        - instance_id
        - active_generation
        - config_revision
        - compiled_summary
        - graph
      properties:
        active_generation:
          type: integer
          format: int64
          minimum: 1
        config_revision:
          type: string
        compiled_summary:
          "$ref": "./common.schemas.yaml#/components/schemas/CompiledSummary"
        graph:
          "$ref": "#/components/schemas/ConfigGraphView"
        instance_id:
          $ref: ./deck.schemas.yaml#/components/schemas/InstanceID
    ConfigGraphView:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - instance
        - client_profiles
        - content_policies
        - routes
        - backend_sets
        - endpoints
        - credentials
        - quota_groups
        - targets
        - model_policies
        - model_projections
        - compatibility_transforms
      properties:
        schema_version:
          type: integer
          enum: [1]
        instance:
          "$ref": "#/components/schemas/InstanceConfig"
        client_profiles:
          type: array
          items:
            $ref: "#/components/schemas/ClientProfileView"
        content_policies:
          type: array
          items:
            "$ref": "#/components/schemas/ContentPolicyConfig"
        routes:
          type: array
          items:
            "$ref": "#/components/schemas/RouteConfig"
        backend_sets:
          type: array
          items:
            "$ref": "#/components/schemas/BackendSetConfig"
        endpoints:
          type: array
          items:
            "$ref": "#/components/schemas/EndpointConfig"
        credentials:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/ProviderCredentialV\
              iew"
        quota_groups:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/QuotaGroupConfig"
        targets:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/TargetConfig"
        model_policies:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/ModelPolicyConfig"
        model_projections:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/ModelProjectionConf\
              ig"
        compatibility_transforms:
          type: array
          items:
            "$ref": "./config-provider.schemas.yaml#/components/schemas/CompatibilityTransf\
              ormConfig"
        managed_objects:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ManagedObject"
    InstanceConfig:
      type: object
      additionalProperties: false
      required:
        - state_root
        - log_level
        - gateway
        - admin
        - tmux
      properties:
        state_root:
          type: string
          minLength: 1
          description: Immutable for the lifetime of one InstanceID.
          x-agent-harbor-unix-socket-preflight:
            capacity: platform_sockaddr_un_sun_path_bytes_minus_one_for_NUL
            timing: instance_compile_before_any_resource_creation
            paths:
              - admin_socket
              - tmux_socket
              - handoff_worst_case
            handoff_suffix: /h/00000000000000000000000000000000.sock
            utf8_accounting: exact_absolute_path_bytes
            overflow: validation_error_without_path_fallback
            fixtures:
              - macOS_exact_103_bytes
              - macOS_104_bytes_rejected
              - long_state_root_rejected
        log_level:
          type: string
          enum:
            - simple
            - detail
        gateway:
          "$ref": "#/components/schemas/GatewayListenerConfig"
        admin:
          "$ref": "#/components/schemas/AdminListenerConfig"
        tmux:
          "$ref": "#/components/schemas/TmuxConfig"
    GatewayListenerConfig:
      type: object
      additionalProperties: false
      required:
        - host
        - port
      properties:
        host:
          type: string
          enum:
            - 127.0.0.1
        port:
          type: integer
          minimum: 1
          maximum: 65535
          not:
            enum:
              - 9090
          description: Immutable for the lifetime of one InstanceID.
    AdminListenerConfig:
      type: object
      additionalProperties: false
      required:
        - unix_socket_name
        - loopback_tcp_enabled
        - loopback_tcp_port
      properties:
        unix_socket_name:
          type: string
          enum:
            - agent-harbor-admin.sock
          description: Exact immutable Agent Harbor Admin socket filename resolved below
            state_root/admin for the lifetime of one InstanceID.
        loopback_tcp_enabled:
          type: boolean
          description: When true, loopback_tcp_port is required and AdminToken lifecycle
            is instance-owned below the state root.
        loopback_tcp_port:
          type: integer
          minimum: 1
          maximum: 65535
          not:
            enum:
              - 9090
          description: Immutable for the lifetime of one InstanceID; reserved by a dormant
            bind before hot enable.
    TmuxConfig:
      type: object
      additionalProperties: false
      required:
        - socket_name
        - session_name
        - status_bar_height
      properties:
        socket_name:
          type: string
          enum:
            - agent-harbor
          description: Exact immutable Agent Harbor tmux socket filename resolved below
            state_root/tmux and passed to tmux with -S for the lifetime of one
            InstanceID.
        session_name:
          type: string
          enum:
            - agent-harbor-tui
          description: Exact immutable Agent Harbor TUI control session for the lifetime
            of one InstanceID.
        status_bar_height:
          type: integer
          minimum: 1
          maximum: 5
      x-agent-harbor-runtime-policy:
        executable: canonical_system_tmux_regular_executable_identity_and_SHA256
        command_prefix:
          - canonical_system_tmux
          - -f
          - /dev/null
          - -S
          - verified_absolute_private_socket
        configuration_sources: none_beyond_Core_commands
        startup_options:
          server:
            exit-empty: off
          global_session:
            update-environment: empty
          control_window_0:
            remain-on-exit: off
          control_pane:
            allow-passthrough: on
          agent_session_window_0:
            remain-on-exit: on
          agent_session_pane:
            allow-passthrough: off
        verification: set_then_read_back_exact_closed_options_before_readiness_or_launch
        lifecycle_poller:
          ownership: one_Core_owner
          interval: SESSION_EXIT_POLL_INTERVAL_250ms
          command_timeout: SESSION_EXIT_QUERY_TIMEOUT_1000ms
          query: exact_one_shot_list-panes_metadata_for_owned_active_session_only
          content: pane_content_and_control_mode_output_forbidden
        forbidden:
          - source-file
          - hooks
          - pipe-pane
          - verbose_flags
          - protocol_or_pane_logging
        tmux_log: Core_owned_structured_lifecycle_events_only_without_raw_control_bytes_argv_environment_pane_content_or_OSC52
        canary_scan: success_failure_preview_OSC52_high_output_and_every_rotated_file
        fixtures:
          - control_pane_OSC52_passthrough_on
          - agent_pane_passthrough_off
          - wrong_scope_passthrough_on_rejected
          - dead_pane_poll_zero_percent_output
          - malicious_user_tmux_conf_ignored
