    CreateAgentSessionRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - client_profile_id
        - workspace
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        client_profile_id:
          "$ref": "./common.schemas.yaml#/components/schemas/ConfigID"
        route_id:
          "$ref": "./common.schemas.yaml#/components/schemas/ConfigID"
        workspace:
          type: string
          minLength: 1
          $ref: ./deck.schemas.yaml#/components/schemas/WorkspacePath
    OneTimeSessionCredential:
      type: object
      additionalProperties: false
      properties:
        session_id:
          "$ref": "./common.schemas.yaml#/components/schemas/SessionID"
        credential:
          type: string
          minLength: 43
          maxLength: 43
          format: password
        created_at:
          "$ref": "./common.schemas.yaml#/components/schemas/Timestamp"
        generation:
          type: integer
          minimum: 1
      required:
        - session_id
        - credential
        - created_at
        - session_id
        - credential
        - generation
        - created_at
    EndAgentSessionRequest:
      type: object
      additionalProperties: false
      required: [mode, timeout_ms]
      properties:
        mode:
          type: string
          enum: [graceful, force]
        timeout_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 30000
    ProviderSecretAccessRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - expected_generation
      properties:
        action:
          type: string
          enum:
            - copy
            - reveal
        expected_generation:
          type: integer
          minimum: 1
    ProviderSecretValue:
      type: object
      additionalProperties: false
      required:
        - credential_id
        - generation
        - value
      properties:
        credential_id:
          "$ref": "./common.schemas.yaml#/components/schemas/ConfigID"
        generation:
          type: integer
          minimum: 1
        value:
          type: string
          format: password
    SessionActivitySource:
      type: string
      enum: [hook, pane, process, lifecycle, unknown]
      x-enum-varnames:
        - SessionActivitySourceHook
        - SessionActivitySourcePane
        - SessionActivitySourceProcess
        - SessionActivitySourceLifecycle
        - SessionActivitySourceUnknown
