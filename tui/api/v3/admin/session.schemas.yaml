                    - unknown
        - oneOf:
            - required:
                - last_error_code
              properties:
                last_error_code:
                  {}
                lifecycle:
                  type: string
                  enum:
                    - failed
            - properties:
                last_error_code:
                  not:
                    {}
                lifecycle:
                  type: string
                  enum:
                    - created
                    - launching
                    - running
                    - idle
                    - ending
                    - ended
        - oneOf:
            - properties:
                lifecycle:
                  type: string
                  enum:
                    - created
                native_provider:
                  not:
                    {}
                native_session_id:
                  not:
                    {}
                tmux_session_name:
                  not:
                    {}
                tmux_window_id:
                  not:
                    {}
            - properties:
                lifecycle:
                  type: string
                  enum:
                    - launching
            - required:
                - tmux_session_name
                - tmux_window_id
              properties:
                lifecycle:
                  type: string
                  enum:
                    - running
                    - ending
                tmux_session_name:
                  {}
                tmux_window_id:
                  {}
            - required:
                - native_provider
                - native_session_id
              properties:
                lifecycle:
                  type: string
